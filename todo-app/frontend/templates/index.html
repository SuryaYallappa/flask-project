<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
</head>
<body>
    <p id="welcome">Hi Plese enter the ToDO-List now</p>

    <div class="centred">

    <form action="/submit" method="POST">
        <label for="name">Item Name:</label>
        <input type="text" id="name" name="name" required><br>
        <label for="email">Item Description:</label>
        <input type="text" id="email" name="email" required><br>
        <label for="itemId">Item ID:</label>
        <input type="text" id="itemId" name="itemId" required><br>
        <label for="itemUUID">Item UUID:</label>
        <input type="text" id="itemUUID" name="itemUUID" required><br>
        <label for="itemHash">Item Hash:</label>
        <input type="text" id="itemHash" name="itemHash" required><br>
        <input type="submit" value="Submit">

    </form>
    <a href="/view"><button>View Data</button></a>
    </div>
</body>
<style>
    body {
        background-color: smokewhite;
    }
    p{
        text-align: center;
        font-size: 30px;
        font-family: Arial, sans-serif;
        color: black;
    }
    .centred {
        margin: auto;
        border: 3px solid blue;
        width: 50%;
        padding: 10px;
        color: black;
    }
</style>
</html>
